name: Verificación

on:
  pull_request:
  push:
    branches: [main, codex/coro-voces-esperanza]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: voces_test
          POSTGRES_USER: voces_test
          POSTGRES_PASSWORD: synthetic_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voces_test -d voces_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://voces_test:synthetic_ci_password@127.0.0.1:5432/voces_test
      TEST_DATABASE_URL: postgresql://voces_test:synthetic_ci_password@127.0.0.1:5432/voces_test
      APP_BASE_URL: http://127.0.0.1:3000
      APP_TIMEZONE: America/Guayaquil
      BETTER_AUTH_SECRET: synthetic-ci-better-auth-secret-32-characters
      QR_SIGNING_SECRET: synthetic-ci-qr-signing-secret-32-characters
      CRON_SECRET: synthetic-ci-cron-secret
      PRIVATE_UPLOAD_DIR: /tmp/voces-ci-uploads
      AI_VISION_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:reference
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Construir imagen de entrega
        run: docker build --tag voces-esperanza:${GITHUB_SHA} .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
