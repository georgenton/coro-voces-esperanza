services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: voces_esperanza
      POSTGRES_USER: voces
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voces -d voces_esperanza"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIMEZONE: America/Guayaquil
      DATABASE_URL: postgresql://voces:${POSTGRES_PASSWORD}@db:5432/voces_esperanza
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET en .env}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?Define QR_SIGNING_SECRET en .env}
      CRON_SECRET: ${CRON_SECRET:?Define CRON_SECRET en .env}
      PRIVATE_UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: 10485760
      AI_VISION_PROVIDER: ${AI_VISION_PROVIDER:-disabled}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-https://api.openai.com/v1}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - private_uploads:/data/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  private_uploads:
